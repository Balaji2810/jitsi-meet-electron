name: CI

on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version-file: '.nvmrc'
    - name: Build it
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm ci
        npm run lint
        npm run dist
    - uses: actions/upload-artifact@v4
      with:
        name: linux-binaries
        path: |
          dist/jitsi-meet-amd64.deb
          dist/jitsi-meet-x86_64.AppImage
          dist/jitsi-meet-arm64.deb
          dist/jitsi-meet-arm64.AppImage
          dist/latest-linux.yml
          dist/latest-linux-arm64.yml
  build-mac:
    name: macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version-file: '.nvmrc'
    - name: Prepare for app signing and notarization
      env:
        MAC_CERT: ${{ secrets.mac_cert }}
      if: ${{ env.MAC_CERT }}
      run: |
        echo "CSC_LINK=${{ secrets.mac_cert }}" >> $GITHUB_ENV
        echo "CSC_KEY_PASSWORD=${{ secrets.mac_cert_password }}" >> $GITHUB_ENV
        echo "CSC_FOR_PULL_REQUEST=true" >> $GITHUB_ENV
        echo "APPLE_ID=${{ secrets.apple_id }}" >> $GITHUB_ENV
        echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.apple_id_password }}" >> $GITHUB_ENV
        echo "APPLE_TEAM_ID=${{ secrets.team_id }}" >> $GITHUB_ENV
    - name: Build it
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm ci
        npm run dist
    - uses: actions/upload-artifact@v4
      with:
        name: mac-binaries
        path: |
          dist/jitsi-meet.dmg
          dist/jitsi-meet.zip
          dist/latest-mac.yml
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version-file: '.nvmrc'
    - name: Build it
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm ci
        npm run dist
    - uses: actions/upload-artifact@v4
      with:
        name: windows-binaries
        path: |
          dist/jitsi-meet.exe
          dist/latest.yml

  create-nightly-release:
    name: Create Nightly Release
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Delete existing nightly release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete nightly --yes --repo ${{ github.repository }}
        git push --delete origin nightly || true
    - name: Create Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        name: Nightly Build
        tag_name: nightly
        files: |
          artifacts/linux-binaries/*
          artifacts/mac-binaries/*
          artifacts/windows-binaries/*
        draft: false
        prerelease: true
        body: |
          Automated nightly build from master branch.
          
          **Commit:** ${{ github.sha }}
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          
          ⚠️ This is a development build and may be unstable.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}